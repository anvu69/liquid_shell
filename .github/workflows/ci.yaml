name: ci

on:
  push:
    branches: [main]
  pull_request:
  # VK-625: re-runs on demand (`gh workflow run ci.yaml --ref <branch>`),
  # for measuring flaky jobs.
  workflow_dispatch:

concurrency:
  # A push or a PR update cancels the older run of its ref. A dispatched run
  # has a group of its own (its run id), so it neither cancels nor is
  # cancelled by another run.
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

# Flutter 3.44.x is the supported floor and blocks merges. Latest stable runs
# as an early warning and never blocks (continue-on-error).
jobs:
  checks:
    name: checks (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: 3.44.x
            experimental: false
          - flutter: stable
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # `a && '' || b` always yields b in Actions ('' is falsy), which sent
          # flutter-version: stable to the action and failed setup. An empty
          # version means the latest release on the channel.
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          cache: true
      - run: make get
      # On the informational stable leg every check runs even after one
      # fails, so a single run shows every stable incompatibility. The job
      # still ends red. The 3.44.x leg keeps stopping at the first failure.
      - run: make format-check
        if: ${{ success() || (failure() && matrix.experimental) }}
      - run: make analyze
        if: ${{ success() || (failure() && matrix.experimental) }}
      - run: make provenance
        if: ${{ success() || (failure() && matrix.experimental) }}
      - run: make public-docs
        if: ${{ success() || (failure() && matrix.experimental) }}
      - run: make pigeon-check
        if: ${{ success() || (failure() && matrix.experimental) }}
      - run: make test
        if: ${{ success() || (failure() && matrix.experimental) }}
      - run: make coverage
        if: ${{ success() || (failure() && matrix.experimental) }}
      - run: make snippets
        if: ${{ success() || (failure() && matrix.experimental) }}

  pana:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: make get
      - run: dart pub global activate pana
      # pana checks that `repository` on GitHub main contains this pubspec.
      # On a branch that adds a package, main does not have it yet, so those
      # 10 points are allowed off main only.
      - name: pana liquid_shell_platform_interface (max score on main)
        run: >
          dart pub global run pana --no-warning
          --exit-code-threshold ${{ github.ref == 'refs/heads/main' && '0' || '10' }}
          liquid_shell_platform_interface
      # These three depend on liquid_shell_platform_interface, which pana can
      # only resolve from pub.dev. Informational until P6 publishes it first.
      # One step each: in a single `bash -e` loop the first failure stopped
      # the loop, so the other two were never scored.
      - name: pana liquid_shell (informational until P6)
        continue-on-error: true
        run: dart pub global run pana --no-warning --exit-code-threshold 0 liquid_shell
      - name: pana liquid_shell_ios (informational until P6)
        continue-on-error: true
        run: dart pub global run pana --no-warning --exit-code-threshold 0 liquid_shell_ios
      - name: pana liquid_shell_android (informational until P6)
        continue-on-error: true
        run: dart pub global run pana --no-warning --exit-code-threshold 0 liquid_shell_android
      - run: make publish-check

  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: make get
      - run: make android-unit

  integration-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: make get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # The default (true) sets animator_duration_scale to 0, which the
          # plugin reads as reduce transparency. The script also sets its own
          # baseline of 1 and restores the starting value on exit.
          disable-animations: false
          script: |
            tool/integration_android.sh
            cd liquid_shell/example && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/liquid_compare_test.dart --dart-define=COMPARE_PLATFORM=android --dart-define=COMPARE_DEVICE=phone --dart-define=COMPARE_MODES=flutterLiquid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquid-android-screenshots
          path: liquid_shell/example/build/integration_screenshots/

  integration-ios:
    runs-on: macos-latest
    # A hung drive once held this job for the full 6 h limit. The script
    # warms the simulator up, then stops a drive after 10 min and retries it
    # once on the same simulator (tool/ios_sim.sh, VK-625): two drive caps
    # plus 30 minutes for setup, the warm-up build and the warm-up.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: make get
      - run: tool/integration_ios.sh
        env:
          IOS_RUNTIME: ""
          IOS_DEVICES: auto
      # VK-625: tool/ios_sim.sh's dumps after a warm-up timeout or a stall
      # (spec 2026-10-16-ci-cold-launch §10); nothing to upload otherwise.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-launch-integration-ios-a${{ github.run_attempt }}
          path: liquid_shell/example/build/ios-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  ios-unit:
    # One job per idiom: the iPhone leg (compact, owner D1) runs the
    # compact and phone-only XCTests, the iPad leg the top bar and sidebar.
    name: ios-unit (${{ matrix.device }})
    runs-on: macos-latest
    # `make ios-unit` builds, warms the simulator up (VK-625), then stops a
    # stalled suite after IOS_UNIT_TIMEOUT (900 s) and never collects test
    # diagnostics, which stalled a red run for minutes. The job is that cap
    # plus 30 minutes for setup, the build and the warm-up.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPad, iPhone]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: make get
      - name: XCTest of liquid_shell_ios on the newest ${{ matrix.device }} simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -F "    ${{ matrix.device }}" | tail -n1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          make ios-unit IOS_UNIT_DEVICE="$udid"
      # A test host crash leaves no stack in the log ("Test crashed with
      # signal segv"): the simulator writes the app's crash report on the
      # host, so a red run keeps it with the bundle.
      - if: failure()
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/Runner-*.ips crash-reports/ 2>/dev/null \
            || echo "no Runner crash report"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-${{ matrix.device }}-diagnostics
          path: |
            liquid_shell/example/build/ios-unit.xcresult
            crash-reports/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-launch-ios-unit-${{ matrix.device }}-a${{ github.run_attempt }}
          path: liquid_shell/example/build/ios-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  ios-ui:
    # Real taps on native dialogs and the native search tab (XCUITest, specs
    # P3a §9.4, P3b §12.6). Non-blocking:
    # simulator UI tests are slow and can flake on shared runners.
    # `make ios-ui` builds, warms the simulator up (VK-625), then stops the
    # suite after IOS_UI_TIMEOUT (2100 s): the iPhone suite (27 of 29 tests
    # run since VK-600) is estimated at about 1700 s on a slow runner and
    # took 1092-1156 s on CI, build included (Makefile). The job is that cap
    # plus 30 minutes for setup, the build and the warm-up.
    name: ios-ui (${{ matrix.device }})
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        device: [iPad, iPhone]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: make get
      - name: XCUITest on the newest ${{ matrix.device }} simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -F "    ${{ matrix.device }}" | tail -n1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          make ios-ui IOS_UNIT_DEVICE="$udid"
      # A red run's bundle (its summary is in the log above, the failure's
      # screenshot is in here) and the app's crash report, if it crashed.
      - if: failure()
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/Runner-*.ips crash-reports/ 2>/dev/null \
            || echo "no Runner crash report"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-${{ matrix.device }}-diagnostics
          path: |
            liquid_shell/example/build/ios-ui.xcresult
            crash-reports/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-launch-ios-ui-${{ matrix.device }}-a${{ github.run_attempt }}
          path: liquid_shell/example/build/ios-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  ios-minimize:
    # M7 of VK-600's review (VK-625): the native tab bar's minimize follows a
    # UIKit trigger Apple does not document, so its real-swipe guard,
    # MinimizeUITests, blocks merges here on one iPhone. ios-ui still runs
    # it, non-blocking, on both idioms. iPhone 17 on iOS 26, pinned as
    # integration-ios-native pins its runtime: the image often lacks iOS 27.
    # `make ios-minimize` builds, warms the simulator up, then stops the
    # suite after IOS_MINIMIZE_TIMEOUT (900 s); the job is that cap plus 30
    # minutes for setup, the build and the warm-up.
    name: ios-minimize (iPhone)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - name: iPhone 17 on iOS 26
        id: sim
        run: |
          udid=$(xcrun simctl list devices available "iOS 26" | grep -F "    iPhone 17 (" | tail -n1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::no iPhone 17 simulator on iOS 26"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - run: make get
      - name: MinimizeUITests on iPhone 17 (iOS 26)
        run: make ios-minimize IOS_UNIT_DEVICE="${{ steps.sim.outputs.udid }}"
      - if: failure()
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/Runner-*.ips crash-reports/ 2>/dev/null \
            || echo "no Runner crash report"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-minimize-iPhone-diagnostics
          path: |
            liquid_shell/example/build/ios-minimize.xcresult
            crash-reports/
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-launch-ios-minimize-iPhone-a${{ github.run_attempt }}
          path: liquid_shell/example/build/ios-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  integration-ios-native:
    # Every iOS 26 iPhone and iPad installs the native chrome (owner D1):
    # one job per idiom, so a stalled simulator costs one leg, not both.
    # Each idiom runs on iOS 26, and again on iOS 27: that leg is an early
    # warning and never blocks. When the runner image has no iOS 27
    # runtime yet it warns and passes, so a red iOS 27 leg means a
    # regression, not a missing simulator.
    name: integration-ios-native (${{ matrix.device }}, ${{ matrix.runtime }})
    runs-on: macos-latest
    continue-on-error: ${{ matrix.runtime == 'iOS 27' }}
    # Three drives per leg (NATIVE_TARGETS: native_shell_test.dart,
    # native_dialogs_test.dart, native_search_test.dart; about 15 min each,
    # build included). The script first builds the example and warms the
    # simulator up (about 10 min at most, VK-625), then stops a stalled
    # drive after 20 min (IOS_DRIVE_TIMEOUT 1200 s) and retries it once on
    # the same simulator, per target: up to 120 min, plus the setup and the
    # native vs Flutter liquid drive (a few minutes; stopped after 20 and
    # retried once the same way).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        device: [iPad, iPhone]
        runtime: ["iOS 26", "iOS 27"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - name: The newest ${{ matrix.device }} simulator on ${{ matrix.runtime }}
        id: sim
        run: |
          udid=$(xcrun simctl list devices available "$IOS_RUNTIME" | grep -F "    ${{ matrix.device }}" | tail -n1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            if [ "$IOS_RUNTIME" = "iOS 27" ]; then
              echo "::warning::no ${{ matrix.device }} simulator on $IOS_RUNTIME in this runner image; leg skipped"
              exit 0
            fi
            echo "::error::no ${{ matrix.device }} simulator on $IOS_RUNTIME"
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
        env:
          IOS_RUNTIME: ${{ matrix.runtime }}
      - if: steps.sim.outputs.udid != ''
        run: make get
      - name: Native shell, dialogs and search tab on the newest ${{ matrix.device }} simulator (${{ matrix.runtime }})
        if: steps.sim.outputs.udid != ''
        run: NATIVE_DEVICES="${{ steps.sim.outputs.udid }}=true" tool/integration_ios_native.sh
        env:
          IOS_RUNTIME: ${{ matrix.runtime }}
          NATIVE_TARGETS: native_shell_test.dart native_dialogs_test.dart native_search_test.dart
      - name: Native vs Flutter liquid on the newest ${{ matrix.device }} simulator (${{ matrix.runtime }})
        if: steps.sim.outputs.udid != ''
        # A drive held this step until the job's 140 minutes (PR #15, run
        # 38734664025). Its Xcode build was done: `simctl launch` had
        # returned, and flutter_tools waited, with no timeout of its own, for
        # the app's VM service URL (VK-625). tool/ios_sim.sh guard stops it
        # after 20 min, dumps diagnostics, terminates the app and retries
        # once on the same simulator, as the native drives are.
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          cd liquid_shell/example
          ../../tool/ios_sim.sh guard "$udid" "liquid_compare_test.dart on ${{ matrix.device }}" 1200 \
            flutter drive --driver=test_driver/integration_test.dart \
            --target=integration_test/liquid_compare_test.dart -d "$udid" \
            --dart-define=COMPARE_PLATFORM=ios \
            --dart-define=COMPARE_DEVICE=$(echo "${{ matrix.device }}" | tr '[:upper:]' '[:lower:]') \
            --dart-define=EXPECT_NATIVE=true
          mkdir -p build/compare
          for n in build/integration_screenshots/ios_*_native.png; do
            dart run ../../tool/side_by_side.dart "$n" "${n%_native.png}_flutterLiquid.png" "build/compare/$(basename "${n%_native.png}").png"
          done
      - uses: actions/upload-artifact@v4
        if: always() && steps.sim.outputs.udid != ''
        with:
          name: native-shell-screenshots-${{ matrix.device }}-${{ strategy.job-index }}
          path: |
            liquid_shell/example/build/integration_screenshots/
            liquid_shell/example/build/compare/
      - if: always() && steps.sim.outputs.udid != ''
        uses: actions/upload-artifact@v4
        with:
          name: cold-launch-native-${{ matrix.device }}-${{ strategy.job-index }}-a${{ github.run_attempt }}
          path: liquid_shell/example/build/ios-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

  goldens:
    name: goldens (${{ matrix.flutter }})
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: 3.44.x
            experimental: false
          - flutter: stable
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # `a && '' || b` always yields b in Actions ('' is falsy), which sent
          # flutter-version: stable to the action and failed setup. An empty
          # version means the latest release on the channel.
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          cache: true
      - run: make get
      # `make goldens` in two steps. On 3.44.x (the floor and the golden
      # reference) both block. On stable the plain goldens and the shader
      # probes decide the leg's colour, and the liquid goldens only inform:
      # newer engines draw the dark glass slightly differently (VK-700),
      # until the reference moves to a newer Flutter at 0.1.0.
      - run: make goldens-plain
      - id: liquid
        run: make goldens-liquid
        continue-on-error: ${{ matrix.experimental }}
      - if: ${{ steps.liquid.outcome == 'failure' }}
        run: echo "::warning title=Liquid goldens differ on Flutter ${{ matrix.flutter }}::Informational on this leg until the golden reference moves (CONTRIBUTING.md, Toolchain)."
      # The shader probes (lens placement and direction) are the early
      # warning for an engine change; on the informational stable leg they
      # must run even when its goldens drift.
      - if: ${{ success() || (always() && matrix.experimental) }}
        run: make test-impeller
      - if: ${{ failure() || steps.liquid.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.flutter }}
          path: liquid_shell/example/test/goldens/failures/
